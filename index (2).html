document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e=\"display: flex; align-items: baseline; gap: 9px; min-width: 0\">\n      <span style=\"font-size: 19px; font-weight: 600; letter-spacing: -0.02em\">FUT Monitor<\u002Fspan>\n      <span style=\"font-size: 11px; font-weight: 600; color: oklch(0.80 0.14 75); border: 1px solid oklch(0.80 0.14 75 / 0.4); border-radius: 4px; padding: 2px 5px; letter-spacing: 0.04em\">FC 27<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: oklch(0.62 0.015 255); white-space: nowrap\">{{ freshness }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"padding: 18px 20px 0\">\n    <div style=\"background: oklch(0.18 0.022 255); border: 1px solid oklch(0.27 0.02 255); border-radius: 13px; padding: 16px 18px\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\">\n        <div style=\"font-size: 14.5px; font-weight: 600\">Mi watchlist<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleConfig }}\" style=\"font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; padding: 6px 10px; border-radius: 7px; border: 1px solid oklch(0.32 0.02 255); background: transparent; color: oklch(0.80 0.14 75); flex: none\">{{ configBtnLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showConfigForm }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: 14px; display: flex; flex-direction: column; gap: 9px\">\n          <div style=\"font-size: 12px; line-height: 1.55; color: oklch(0.68 0.015 255); text-wrap: pretty\">Conecta tu repositorio para añadir y quitar jugadores desde aquí. Necesitas un token de GitHub (fine-grained, permiso Contents: Read and write, solo sobre este repo). Se guarda únicamente en este navegador.<\u002Fdiv>\n          <input value=\"{{ cfgOwner }}\" sc-camel-on-change=\"{{ onOwnerChange }}\" placeholder=\"usuario de GitHub\" style=\"width: 100%; font-family: inherit; font-size: 13px; padding: 9px 11px; border-radius: 8px; border: 1px solid oklch(0.30 0.02 255); background: oklch(0.14 0.018 255); color: oklch(0.90 0.005 255)\">\n          <input value=\"{{ cfgRepo }}\" sc-camel-on-change=\"{{ onRepoChange }}\" placeholder=\"nombre del repositorio\" style=\"width: 100%; font-family: inherit; font-size: 13px; padding: 9px 11px; border-radius: 8px; border: 1px solid oklch(0.30 0.02 255); background: oklch(0.14 0.018 255); color: oklch(0.90 0.005 255)\">\n          <input value=\"{{ cfgBranch }}\" sc-camel-on-change=\"{{ onBranchChange }}\" placeholder=\"rama (main o master)\" style=\"width: 100%; font-family: inherit; font-size: 13px; padding: 9px 11px; border-radius: 8px; border: 1px solid oklch(0.30 0.02 255); background: oklch(0.14 0.018 255); color: oklch(0.90 0.005 255)\">\n          <input value=\"{{ cfgToken }}\" sc-camel-on-change=\"{{ onTokenChange }}\" type=\"password\" placeholder=\"token (github_pat_…)\" style=\"width: 100%; font-family: inherit; font-size: 13px; padding: 9px 11px; border-radius: 8px; border: 1px solid oklch(0.30 0.02 255); background: oklch(0.14 0.018 255); color: oklch(0.90 0.005 255)\">\n          <button sc-camel-on-click=\"{{ onConnect }}\" style=\"width: 100%; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 11px; border-radius: 9px; border: none; background: oklch(0.80 0.14 75); color: oklch(0.18 0.03 75)\">{{ connectBtnLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ cfgMsg }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 12px; line-height: 1.5; color: oklch(0.74 0.05 75)\">{{ cfgMsg }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ connected }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: 14px; display: flex; flex-direction: column; gap: 2px\">\n          <sc-for list=\"{{ wlRows }}\" as=\"w\" hint-placeholder-count=\"2\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid oklch(0.24 0.02 255)\">\n              <div style=\"flex: 1; min-width: 0\">\n                <div style=\"font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: capitalize\">{{ w.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ w.onCycleTag }}\" style=\"flex: none; font-size: 10.5px; font-weight: 600; padding: 5px 8px; border-radius: 6px; border: 1px solid oklch(0.80 0.14 75 / 0.35); background: oklch(0.80 0.14 75 / 0.1); color: oklch(0.80 0.14 75); cursor: pointer\">{{ w.tagLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ w.onRemove }}\" style=\"flex: none; font-size: 10.5px; font-weight: 600; padding: 5px 8px; border-radius: 6px; border: 1px solid oklch(0.60 0.18 25 / 0.4); background: transparent; color: oklch(0.72 0.18 25); cursor: pointer\">Quitar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"margin-top: 10px; display: flex; flex-direction: column; gap: 8px\">\n            <input value=\"{{ newUrl }}\" sc-camel-on-change=\"{{ onNewUrlChange }}\" placeholder=\"enlace del jugador en fut.gg\" style=\"width: 100%; font-family: inherit; font-size: 13px; padding: 9px 11px; border-radius: 8px; border: 1px solid oklch(0.30 0.02 255); background: oklch(0.14 0.018 255); color: oklch(0.90 0.005 255)\">\n            <div style=\"display: flex; gap: 6px\">\n              <sc-for list=\"{{ tagPicker }}\" as=\"tp\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ tp.onClick }}\" style=\"flex: 1; font-size: 12px; font-weight: 600; padding: 8px; border-radius: 7px; border: 1px solid {{ tp.border }}; background: {{ tp.bg }}; color: {{ tp.fg }}; cursor: pointer\">{{ tp.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onAddPlayer }}\" style=\"width: 100%; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 11px; border-radius: 9px; border: none; background: oklch(0.80 0.14 75); color: oklch(0.18 0.03 75)\">{{ addBtnLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ wlMsg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 12px; line-height: 1.5; color: oklch(0.74 0.05 75); text-wrap: pretty\">{{ wlMsg }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasData }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px\">\n\n      <sc-if value=\"{{ portfolio }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: oklch(0.19 0.025 255); border: 1px solid oklch(0.28 0.022 255); border-radius: 14px; padding: 18px 20px\">\n          <div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.64 0.015 255)\">Mi cartera<\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 10px; margin-top: 10px; flex-wrap: wrap\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 31px; font-weight: 600; letter-spacing: -0.03em; line-height: 1\">{{ pf.profit }}<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: oklch(0.68 0.015 255)\">{{ pf.pct }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid oklch(0.26 0.02 255)\">\n            <div>\n              <div style=\"font-size: 10.5px; color: oklch(0.62 0.015 255); letter-spacing: 0.04em\">INVERTIDO<\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; margin-top: 3px\">{{ pf.cost }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 10.5px; color: oklch(0.62 0.015 255); letter-spacing: 0.04em\">NETO SI VENDO HOY<\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; margin-top: 3px\">{{ pf.netValue }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 11.5px; color: oklch(0.60 0.015 255); margin-top: 12px; line-height: 1.5\">Con el 5% de impuesto de EA ya descontado.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ nextEvent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; align-items: center; gap: 12px; background: oklch(0.80 0.14 75 / 0.09); border: 1px solid oklch(0.80 0.14 75 / 0.28); border-radius: 11px; padding: 12px 15px\">\n          <span style=\"width: 7px; height: 7px; border-radius: 50%; background: oklch(0.80 0.14 75); flex: none\"><\u002Fspan>\n          <div style=\"min-width: 0; flex: 1\">\n            <div style=\"font-size: 13.5px; font-weight: 600\">{{ ev.name }}<\u002Fdiv>\n            <div style=\"font-size: 11.5px; color: oklch(0.70 0.04 75); margin-top: 1px\">{{ ev.when }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.onSelect }}\" style=\"flex: none; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; padding: 7px 13px; border-radius: 8px; white-space: nowrap; border: 1px solid {{ t.border }}; background: {{ t.bg }}; color: {{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"background: oklch(0.18 0.022 255); border: 1px solid oklch(0.27 0.02 255); border-radius: 13px; padding: 14px 15px\">\n            <div style=\"display: flex; gap: 13px; align-items: flex-start\">\n              <div style=\"width: 46px; height: 62px; flex: none; border-radius: 6px; background-color: oklch(0.24 0.02 255); background-image: {{ r.imgCss }}; background-size: contain; background-position: center; background-repeat: no-repeat; overflow: hidden\"><\u002Fdiv>\n              <div style=\"flex: 1; min-width: 0\">\n                <div style=\"display: flex; align-items: baseline; gap: 7px; min-width: 0\">\n                  <span style=\"font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ r.name }}<\u002Fspan>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; color: oklch(0.80 0.14 75); flex: none\">{{ r.badge }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size: 11.5px; color: oklch(0.62 0.015 255); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ r.sub }}<\u002Fdiv>\n                <div style=\"display: flex; align-items: baseline; gap: 9px; margin-top: 9px; flex-wrap: wrap\">\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; letter-spacing: -0.02em\">{{ r.price }}<\u002Fspan>\n                  <sc-if value=\"{{ r.isNet }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: oklch(0.58 0.015 255)\">NETO<\u002Fspan>\n                  <\u002Fsc-if>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: {{ r.changeColor }}\">{{ r.change }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ r.hasRange }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top: 13px\">\n                <div style=\"position: relative; height: 4px; border-radius: 2px; background: oklch(0.28 0.02 255)\">\n                  <span style=\"position: absolute; top: -3px; width: 3px; height: 10px; border-radius: 2px; background: oklch(0.96 0.005 255); left: {{ r.posPct }}\"><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: oklch(0.58 0.015 255); margin-top: 5px\">\n                  <span>{{ r.rangeMin }}<\u002Fspan>\n                  <span>media 30d {{ r.rangeAvg }}<\u002Fspan>\n                  <span>{{ r.rangeMax }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ r.verdict }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size: 12.5px; line-height: 1.5; color: oklch(0.78 0.012 255); margin-top: 12px; padding-top: 11px; border-top: 1px solid oklch(0.25 0.02 255); text-wrap: pretty\">{{ r.verdict }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px\">\n              <sc-for list=\"{{ r.chips }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <span style=\"font-size: 11px; font-weight: 500; padding: 4px 8px; border-radius: 6px; background: {{ c.bg }}; color: {{ c.fg }}; border: 1px solid {{ c.border }}\">{{ c.text }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ noRows }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align: center; padding: 36px 20px; color: oklch(0.60 0.015 255); font-size: 13.5px\">Nada en esta pestaña todavía.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showSetup }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding: 24px 20px 0; display: flex; flex-direction: column; gap: 18px\">\n      <div style=\"background: oklch(0.19 0.025 255); border: 1px solid oklch(0.28 0.022 255); border-radius: 14px; padding: 20px\">\n        <div style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.015em\">Esperando la primera recogida<\u002Fdiv>\n        <div style=\"font-size: 13.5px; line-height: 1.6; color: oklch(0.72 0.012 255); margin-top: 9px; text-wrap: pretty\">Los precios vienen de los archivos públicos de fut.gg, que se actualizan cada pocos minutos. El motor los recoge solo cada 30 minutos con GitHub Actions y te manda la alerta a Telegram. Aquí no hay ni un dato inventado: hasta que la primera recogida corra, esta pantalla está vacía a propósito.<\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.58 0.015 255); margin-top: 14px; word-break: break-all\">leyendo: {{ srcLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.64 0.015 255); margin-bottom: 12px\">Montaje · unos 10 minutos<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 2px\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"display: flex; gap: 13px; padding: 13px 0; border-bottom: 1px solid oklch(0.23 0.02 255)\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: oklch(0.80 0.14 75); flex: none; width: 16px; padding-top: 1px\">{{ s.n }}<\u002Fspan>\n              <div style=\"min-width: 0\">\n                <div style=\"font-size: 14px; font-weight: 600; letter-spacing: -0.01em\">{{ s.title }}<\u002Fdiv>\n                <div style=\"font-size: 12.5px; line-height: 1.55; color: oklch(0.68 0.015 255); margin-top: 3px; text-wrap: pretty\">{{ s.body }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: oklch(0.18 0.022 255); border: 1px solid oklch(0.27 0.02 255); border-radius: 13px; padding: 16px 18px\">\n        <div style=\"font-size: 13.5px; font-weight: 600\">Lo que la app añade a fut.gg<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 11px\">\n          <sc-for list=\"{{ perks }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; gap: 10px; font-size: 12.5px; line-height: 1.5; color: oklch(0.74 0.012 255)\">\n              <span style=\"color: oklch(0.80 0.14 75); flex: none\">—<\u002Fspan>\n              <span style=\"text-wrap: pretty\">{{ p.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"padding: 18px 20px 0\">\n    <div style=\"background: oklch(0.18 0.022 255); border: 1px solid oklch(0.27 0.02 255); border-radius: 13px; padding: 18px\">\n      <div style=\"font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em\">Notificaciones en este móvil<\u002Fdiv>\n      <div style=\"font-size: 12.5px; line-height: 1.6; color: oklch(0.70 0.015 255); margin-top: 7px; text-wrap: pretty\">Segundo canal, aparte de Telegram. En iPhone solo funciona si antes has añadido la app a la pantalla de inicio desde Safari.<\u002Fdiv>\n\n      <sc-if value=\"{{ notifCanEnable }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ enableNotifs }}\" style=\"width: 100%; margin-top: 14px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 12px; border-radius: 9px; border: none; background: oklch(0.80 0.14 75); color: oklch(0.18 0.03 75)\">{{ notifBtn }}<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ notifHasSub }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: 14px\">\n          <div style=\"font-size: 12.5px; line-height: 1.6; color: oklch(0.78 0.012 255); text-wrap: pretty\">Permiso concedido. Último paso: copia este texto y guárdalo en tu repositorio como secret <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.80 0.14 75)\">PUSH_SUBSCRIPTION<\u002Fspan>.<\u002Fdiv>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.5; color: oklch(0.72 0.012 255); background: oklch(0.14 0.018 255); border: 1px solid oklch(0.26 0.02 255); border-radius: 8px; padding: 11px; margin-top: 10px; max-height: 140px; overflow: auto; word-break: break-all\">{{ subJson }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ copySub }}\" style=\"width: 100%; margin-top: 9px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 11px; border-radius: 9px; border: 1px solid oklch(0.32 0.02 255); background: transparent; color: oklch(0.90 0.01 255)\">{{ copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ notifMsg }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size: 12.5px; line-height: 1.6; color: oklch(0.74 0.05 75); margin-top: 13px; text-wrap: pretty\">{{ notifMsg }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900},&quot;dataUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;./data/summary.json&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;,&quot;label&quot;:&quot;Origen de los datos&quot;},&quot;netPrices&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Datos&quot;,&quot;label&quot;:&quot;Mostrar precios netos (5% descontado)&quot;}}\">\nclass Component extends DCLogic {\n  static VAPID = \"BKyRa3GJEVNJOVm75KFFTaCOiex24-N5Ab6x1RyFfSe_gLZZ8iqQWpY2Pxd2IPjofwQbBD4hMQTOfTXNWfyOyBc\";\n\n  state = {\n    data: null, loaded: false, tab: \"all\",\n    notif: \"idle\", subJson: \"\", notifMsg: \"\", copied: false,\n    cfgOwner: \"\", cfgRepo: \"\", cfgBranch: \"main\", cfgToken: \"\",\n    showConfigForm: false, connected: false, sha: null, wlPlayers: [],\n    cfgMsg: \"\", wlMsg: \"\", newUrl: \"\", newTag: \"watch\", busy: false\n  };\n\n  ghApiUrl() {\n    return \"https://api.github.com/repos/\" + this.state.cfgOwner + \"/\" + this.state.cfgRepo + \"/contents/data/players.json\";\n  }\n\n  ghHeaders() {\n    return { Authorization: \"Bearer \" + this.state.cfgToken, Accept: \"application/vnd.github+json\" };\n  }\n\n  ghB64encode(str) { return btoa(unescape(encodeURIComponent(str))); }\n  ghB64decode(str) { return decodeURIComponent(escape(atob(str))); }\n\n  persistGhCfg() {\n    const { cfgOwner, cfgRepo, cfgBranch, cfgToken } = this.state;\n    localStorage.setItem(\"futmon_gh_cfg\", JSON.stringify({ cfgOwner, cfgRepo, cfgBranch, cfgToken }));\n  }\n\n  async connectGh() {\n    this.setState({ cfgMsg: \"Conectando…\", busy: true });\n    try {\n      const branch = this.state.cfgBranch || \"main\";\n      const r = await fetch(this.ghApiUrl() + \"?ref=\" + encodeURIComponent(branch), { headers: this.ghHeaders() });\n      if (!r.ok) {\n        throw new Error(r.status === 404\n          ? \"No encuentro data/players.json en ese repo o rama. Revisa el nombre y la rama (main o master).\"\n          : r.status === 401\n          ? \"Token no válido o sin permiso. Revisa que sea fine-grained con Contents: Read and write.\"\n          : \"Error \" + r.status + \" al conectar.\");\n      }\n      const j = await r.json();\n      const cfg = JSON.parse(this.ghB64decode(j.content));\n      this.persistGhCfg();\n      this.setState({ connected: true, sha: j.sha, wlPlayers: cfg.players || [], cfgMsg: \"\", showConfigForm: false, busy: false });\n    } catch (e) {\n      this.setState({ cfgMsg: e.message, busy: false, connected: false });\n    }\n  }\n\n  async saveWatchlist(players, msg) {\n    this.setState({ busy: true, wlMsg: \"Guardando…\" });\n    try {\n      const body = JSON.stringify({ settings: { platform: \"ps5\" }, players }, null, 2) + \"\\n\";\n      const r = await fetch(this.ghApiUrl(), {\n        method: \"PUT\",\n        headers: this.ghHeaders(),\n        body: JSON.stringify({\n          message: msg, content: this.ghB64encode(body), sha: this.state.sha,\n          branch: this.state.cfgBranch || \"main\"\n        })\n      });\n      if (!r.ok) throw new Error(\"Error \" + r.status + \" al guardar. Vuelve a conectar.\");\n      const j = await r.json();\n      this.setState({ wlPlayers: players, sha: j.content.sha, busy: false,\n        wlMsg: \"Guardado. El precio llega en la próxima recogida (máx. 30 min).\" });\n    } catch (e) {\n      this.setState({ wlMsg: e.message, busy: false });\n    }\n  }\n\n  addPlayer() {\n    const m = (this.state.newUrl || \"\").match(/fut\\.gg\\/players\\/(\\d+)-[^/]*\\/27-(\\d+)/);\n    if (!m) return this.setState({ wlMsg: \"Ese enlace no parece la página de un jugador de fut.gg (FC 27). Cópialo entero desde la barra de direcciones.\" });\n    const cardId = Number(m[2]);\n    if (this.state.wlPlayers.some(p => Number(p.cardId) === cardId)) {\n      return this.setState({ wlMsg: \"Ya lo tienes en la lista.\" });\n    }\n    const player = {\n      url: this.state.newUrl.split(\"?\")[0], eaId: Number(m[1]), cardId,\n      tag: this.state.newTag, alertMode: \"off\", targetPrice: null, buyPrice: null, qty: 0\n    };\n    this.saveWatchlist(this.state.wlPlayers.concat([player]), \"watchlist: añadir jugador\");\n    this.setState({ newUrl: \"\" });\n  }\n\n  removePlayer(cardId) {\n    this.saveWatchlist(this.state.wlPlayers.filter(p => p.cardId !== cardId), \"watchlist: quitar jugador\");\n  }\n\n  cycleTag(cardId) {\n    const order = [\"squad\", \"watch\", \"invest\"];\n    const players = this.state.wlPlayers.map(p => {\n      if (p.cardId !== cardId) return p;\n      const i = order.indexOf(p.tag || \"watch\");\n      return Object.assign({}, p, { tag: order[(i + 1) % order.length] });\n    });\n    this.saveWatchlist(players, \"watchlist: cambiar etiqueta\");\n  }\n\n  nameFor(cardId, url) {\n    const found = this.state.data && this.state.data.players && this.state.data.players.find(p => p.cardId === cardId);\n    if (found && found.name) return found.name;\n    const m = (url || \"\").match(/players\\/\\d+-([^/]+)\\//);\n    return m ? m[1].replace(/-/g, \" \") : \"Carta \" + cardId;\n  }\n\n  b64ToBytes(s) {\n    const pad = \"=\".repeat((4 - (s.length % 4)) % 4);\n    const raw = atob((s + pad).replace(/-/g, \"+\").replace(/_/g, \"/\"));\n    return Uint8Array.from(raw, c => c.charCodeAt(0));\n  }\n\n  async enableNotifs() {\n    const msg = m => this.setState({ notifMsg: m });\n    if (!(\"serviceWorker\" in navigator) || !(\"PushManager\" in window)) {\n      this.setState({ notif: \"no\" });\n      return msg(\"Este navegador no soporta notificaciones push. En iPhone tiene que ser Safari, y la app añadida a la pantalla de inicio.\");\n    }\n    if (window.navigator.standalone === false) {\n      return msg(\"Antes añade la app a la pantalla de inicio: botón de compartir en Safari → Añadir a pantalla de inicio. iOS no da permiso de notificaciones si no está instalada.\");\n    }\n    this.setState({ notif: \"working\", notifMsg: \"\" });\n    try {\n      const reg = await navigator.serviceWorker.register(\"./sw.js\");\n      const perm = await Notification.requestPermission();\n      if (perm !== \"granted\") {\n        this.setState({ notif: \"idle\" });\n        return msg(\"Has denegado el permiso. Puedes volver a darlo en Ajustes → Notificaciones → FUT Monitor.\");\n      }\n      let sub = await reg.pushManager.getSubscription();\n      if (!sub) {\n        sub = await reg.pushManager.subscribe({\n          userVisibleOnly: true,\n          applicationServerKey: this.b64ToBytes(Component.VAPID)\n        });\n      }\n      this.setState({\n        notif: \"ready\",\n        subJson: JSON.stringify(sub.toJSON()),\n        notifMsg: \"\"\n      });\n    } catch (e) {\n      this.setState({ notif: \"idle\" });\n      msg(\"No se ha podido activar: \" + (e && e.message ? e.message : e));\n    }\n  }\n\n  async copySub() {\n    try {\n      await navigator.clipboard.writeText(this.state.subJson);\n      this.setState({ copied: true });\n      setTimeout(() => this.setState({ copied: false }), 2000);\n    } catch (e) {\n      this.setState({ notifMsg: \"No he podido copiar solo. Selecciona el texto a mano.\" });\n    }\n  }\n\n  componentDidMount() {\n    this.load();\n    try {\n      const saved = JSON.parse(localStorage.getItem(\"futmon_gh_cfg\") || \"null\");\n      if (saved && saved.cfgOwner && saved.cfgRepo && saved.cfgToken) {\n        this.setState(saved, () => this.connectGh());\n      }\n    } catch (e) { /* sin config guardada */ }\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.dataUrl !== this.props.dataUrl) this.load();\n  }\n\n  load() {\n    const url = this.src();\n    fetch(url, { cache: \"no-store\" })\n      .then(r => (r.ok ? r.json() : null))\n      .then(d => this.setState({ data: d && d.players ? d : null, loaded: true }))\n      .catch(() => this.setState({ data: null, loaded: true }));\n  }\n\n  src() { return this.props.dataUrl || \"./data/summary.json\"; }\n\n  coins(v) {\n    if (v === null || v === undefined) return \"—\";\n    return new Intl.NumberFormat(\"es-ES\").format(Math.round(v));\n  }\n\n  signed(v) {\n    if (v === null || v === undefined) return \"\";\n    const s = v >= 0 ? \"+\" : \"−\";\n    return s + this.coins(Math.abs(v));\n  }\n\n  ago(ts) {\n    if (!ts) return \"\";\n    const m = Math.round((Date.now() / 1000 - ts) / 60);\n    if (m < 1) return \"ahora mismo\";\n    if (m < 60) return \"hace \" + m + \" min\";\n    const h = Math.round(m / 60);\n    if (h < 24) return \"hace \" + h + \" h\";\n    return \"hace \" + Math.round(h / 24) + \" d\";\n  }\n\n  renderVals() {\n    const d = this.state.data;\n    const net = this.props.netPrices !== false;\n    const GOLD = \"oklch(0.80 0.14 75)\";\n    const UP = \"oklch(0.76 0.15 150)\";\n    const DOWN = \"oklch(0.70 0.18 25)\";\n    const MUTED = \"oklch(0.64 0.015 255)\";\n\n    const tabDefs = [\n      { id: \"all\", label: \"Todos\" },\n      { id: \"squad\", label: \"Mi plantilla\" },\n      { id: \"watch\", label: \"Deseados\" },\n      { id: \"invest\", label: \"Inversión\" }\n    ];\n    const tabs = tabDefs.map(t => {\n      const on = this.state.tab === t.id;\n      return {\n        label: t.label,\n        onSelect: () => this.setState({ tab: t.id }),\n        bg: on ? GOLD : \"transparent\",\n        fg: on ? \"oklch(0.18 0.03 75)\" : MUTED,\n        border: on ? GOLD : \"oklch(0.30 0.02 255)\"\n      };\n    });\n\n    const all = (d && d.players) || [];\n    const list = this.state.tab === \"all\" ? all : all.filter(p => p.tag === this.state.tab);\n\n    const rows = list.map(p => {\n      const shown = net && p.netNow ? p.netNow : p.price;\n      const s30raw = p.stats30d;\n      const taxMul = net ? 0.95 : 1;\n      const s30 = s30raw ? { min: s30raw.min * taxMul, max: s30raw.max * taxMul, avg: s30raw.avg * taxMul } : null;\n      const hasRange = !!(s30 && s30.min && s30.max && s30.max > s30.min && shown);\n      const pos = hasRange\n        ? Math.min(100, Math.max(0, ((shown - s30.min) / (s30.max - s30.min)) * 100))\n        : 0;\n\n      const chips = [];\n      if (p.targetPrice && p.alertMode !== \"off\") {\n        chips.push({\n          text: (p.alertMode === \"below\" ? \"Avisa si baja de \" : \"Avisa si sube de \") + this.coins(p.targetPrice),\n          bg: \"oklch(0.80 0.14 75 / 0.12)\", fg: GOLD, border: \"oklch(0.80 0.14 75 / 0.3)\"\n        });\n      }\n      if (p.buyPrice) {\n        chips.push({\n          text: \"Compré a \" + this.coins(p.buyPrice) + (p.qty > 1 ? \" ×\" + p.qty : \"\"),\n          bg: \"oklch(0.24 0.02 255)\", fg: \"oklch(0.76 0.012 255)\", border: \"oklch(0.30 0.02 255)\"\n        });\n      }\n      if (p.netProfitTotal !== null && p.netProfitTotal !== undefined) {\n        const good = p.netProfitTotal >= 0;\n        chips.push({\n          text: (good ? \"Neto +\" : \"Neto −\") + this.coins(Math.abs(p.netProfitTotal)),\n          bg: good ? \"oklch(0.76 0.15 150 / 0.12)\" : \"oklch(0.70 0.18 25 / 0.12)\",\n          fg: good ? UP : DOWN,\n          border: good ? \"oklch(0.76 0.15 150 / 0.3)\" : \"oklch(0.70 0.18 25 / 0.3)\"\n        });\n      }\n      if (p.extinct) {\n        chips.push({\n          text: \"Extinta · sin precio\",\n          bg: \"oklch(0.24 0.02 255)\", fg: MUTED, border: \"oklch(0.30 0.02 255)\"\n        });\n      }\n\n      return {\n        name: p.name || \"Carta \" + p.cardId,\n        badge: [p.rating, p.position].filter(Boolean).join(\" \"),\n        sub: [p.rarityName, p.clubName].filter(Boolean).join(\" · \") || \"—\",\n        imgCss: p.cardImageUrl ? 'url(\"' + p.cardImageUrl + '\")' : \"none\",\n        price: this.coins(shown),\n        isNet: net && !!p.netNow,\n        change: p.change24h ? this.signed(p.change24h) + \" 24h\" : \"\",\n        changeColor: !p.change24h ? MUTED : p.change24h > 0 ? UP : DOWN,\n        hasRange,\n        posPct: pos.toFixed(1) + \"%\",\n        rangeMin: hasRange ? this.coins(s30.min) : \"\",\n        rangeMax: hasRange ? this.coins(s30.max) : \"\",\n        rangeAvg: hasRange ? this.coins(s30.avg) : \"\",\n        verdict: p.verdict || null,\n        chips\n      };\n    });\n\n    const pfRaw = d && d.portfolio;\n    const pf = pfRaw\n      ? {\n          profit: this.signed(pfRaw.netProfit),\n          pct: (pfRaw.pct >= 0 ? \"+\" : \"\") + pfRaw.pct + \"%\",\n          cost: this.coins(pfRaw.cost),\n          netValue: this.coins(pfRaw.netValue)\n        }\n      : null;\n\n    const evRaw = d && d.nextEvent;\n    const ev = evRaw\n      ? {\n          name: evRaw.name,\n          when:\n            evRaw.daysAway === 0 ? \"hoy\"\n            : evRaw.daysAway === 1 ? \"mañana\"\n            : \"en \" + evRaw.daysAway + \" días · \" + evRaw.date\n        }\n      : null;\n\n    const steps = [\n      { n: \"1\", title: \"Crea el repositorio en GitHub\", body: \"Público, para que GitHub Pages y los minutos de Actions sean gratis. Dentro solo hay precios de cartas: tu token nunca se sube.\" },\n      { n: \"2\", title: \"Sube estos archivos\", body: \"Arrastrándolos en la web, sin instalar nada. El planificador tiene que quedar en .github/workflows/monitor.yml (aquí está como workflow-monitor.yml).\" },\n      { n: \"3\", title: \"Crea el bot de Telegram\", body: \"Habla con @BotFather, /newbot, y guarda el token. Mándale un mensaje a tu bot y saca tu chat id.\" },\n      { n: \"4\", title: \"Guarda los dos secretos\", body: \"Settings → Secrets and variables → Actions: TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID.\" },\n      { n: \"5\", title: \"Activa GitHub Pages\", body: \"Settings → Pages → rama main, carpeta raíz. Abre la URL en el móvil y añádela a la pantalla de inicio.\" },\n      { n: \"6\", title: \"Lanza la primera recogida\", body: \"Pestaña Actions → FUT Monitor → Run workflow. Desde ahí va solo cada 30 minutos.\" }\n    ];\n\n    const perks = [\n      { text: \"Tu precio de compra, que ninguna web puede saber, y el beneficio neto con el 5% de EA ya restado.\" },\n      { text: \"Dónde está el precio de hoy dentro de su recorrido de 30 días: así se ven los picos, no con un número suelto.\" },\n      { text: \"Tu calendario de promos cruzado con el precio, para que la alerta diga por qué ahora.\" }\n    ];\n\n    return {\n      hasData: !!(d && d.players && d.players.length),\n      showSetup: !(d && d.players && d.players.length),\n      noRows: !!(d && d.players && d.players.length && rows.length === 0),\n      freshness: d ? this.ago(d.pricesPublishedAt || d.generatedAt) : (this.state.loaded ? \"sin datos\" : \"cargando…\"),\n      srcLabel: this.src(),\n      portfolio: !!pf,\n      pf: pf || { profit: \"—\", pct: \"\", cost: \"—\", netValue: \"—\" },\n      nextEvent: !!ev,\n      ev: ev || { name: \"\", when: \"\" },\n      tabs,\n      rows,\n      steps,\n      perks,\n      notifCanEnable: this.state.notif === \"idle\" || this.state.notif === \"working\",\n      notifHasSub: this.state.notif === \"ready\" && !!this.state.subJson,\n      notifBtn: this.state.notif === \"working\" ? \"Activando…\" : \"Activar notificaciones\",\n      notifMsg: this.state.notifMsg || null,\n      subJson: this.state.subJson,\n      copyLabel: this.state.copied ? \"Copiado\" : \"Copiar\",\n      enableNotifs: () => this.enableNotifs(),\n      copySub: () => this.copySub(),\n\n      toggleConfig: () => this.setState({ showConfigForm: !this.state.showConfigForm }),\n      configBtnLabel: this.state.connected ? \"Ajustes\" : (this.state.showConfigForm ? \"Cerrar\" : \"Conectar repositorio\"),\n      showConfigForm: this.state.showConfigForm,\n      cfgOwner: this.state.cfgOwner,\n      cfgRepo: this.state.cfgRepo,\n      cfgBranch: this.state.cfgBranch,\n      cfgToken: this.state.cfgToken,\n      onOwnerChange: e => this.setState({ cfgOwner: e.target.value }),\n      onRepoChange: e => this.setState({ cfgRepo: e.target.value }),\n      onBranchChange: e => this.setState({ cfgBranch: e.target.value }),\n      onTokenChange: e => this.setState({ cfgToken: e.target.value }),\n      onConnect: () => this.connectGh(),\n      connectBtnLabel: this.state.busy ? \"Conectando…\" : \"Conectar\",\n      cfgMsg: this.state.cfgMsg || null,\n      connected: this.state.connected,\n      wlRows: (this.state.wlPlayers || []).map(p => {\n        const labels = { squad: \"Plantilla\", watch: \"Deseado\", invest: \"Inversión\" };\n        return {\n          label: this.nameFor(p.cardId, p.url),\n          tagLabel: labels[p.tag] || \"Deseado\",\n          onCycleTag: () => this.cycleTag(p.cardId),\n          onRemove: () => this.removePlayer(p.cardId)\n        };\n      }),\n      newUrl: this.state.newUrl,\n      onNewUrlChange: e => this.setState({ newUrl: e.target.value }),\n      tagPicker: [\"squad\", \"watch\", \"invest\"].map(id => {\n        const labels = { squad: \"Plantilla\", watch: \"Deseado\", invest: \"Inversión\" };\n        const on = this.state.newTag === id;\n        return {\n          label: labels[id],\n          onClick: () => this.setState({ newTag: id }),\n          bg: on ? GOLD : \"transparent\",\n          fg: on ? \"oklch(0.18 0.03 75)\" : MUTED,\n          border: on ? GOLD : \"oklch(0.30 0.02 255)\"\n        };\n      }),\n      onAddPlayer: () => this.addPlayer(),\n      addBtnLabel: this.state.busy ? \"Guardando…\" : \"+ Añadir jugador\",\n      wlMsg: this.state.wlMsg || null\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
